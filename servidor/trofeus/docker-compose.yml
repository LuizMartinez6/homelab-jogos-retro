name: trofeus
services:
  trofeus:
    image: python:3.15-alpine
    container_name: trofeus
    restart: unless-stopped
    working_dir: /app
    command: ["python", "-u", "/app/servidor.py"]
    ports:
      - "8090:8090"
    volumes:
      - /DATA/AppData/trofeus:/app
