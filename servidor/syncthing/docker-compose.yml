name: syncthing
services:
  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - PUID=999
      - PGID=1000
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - /DATA/AppData/syncthing/config:/config:rw
      - /DATA/Saves:/saves:rw
x-casaos:
  architectures:
    - amd64
  author: Neto
  category: Utilities
  description:
    en_US: Sincronizacao de saves entre PC, celular e servidor.
  developer: Syncthing
  icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/syncthing.png
  id: local.neto.syncthing
  index: /
  main: syncthing
  port_map: "8384"
  scheme: http
  store_app_id: syncthing
  tagline:
    en_US: Syncthing
  thumbnail: ""
  title:
    en_US: Syncthing
