# Servidor de jogos de PC e atualizacoes do instalador.
# Rede local: acesso direto na porta 8095.
# Fora de casa (Tailscale pelo "tailscale serve", NetBird direto): cada amigo baixa um
# jogo por vez e no maximo 4 amigos ao mesmo tempo (o upload da casa mede ~95-170 Mbps).
# Quem fica de fora recebe 503 e o programa tenta de novo sozinho.

worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    map $remote_addr $fila_remota {
        "~^192\.168\.0\." "";
        default           "remota";
    }
    map $remote_addr $amigo_remoto {
        "~^192\.168\.0\." "";
        default           $remote_user;
    }
    limit_conn_zone $fila_remota zone=remota:1m;
    limit_conn_zone $amigo_remoto zone=amigo:1m;
    limit_conn_status 503;

    server {
        listen 8095;
        root /srv;
        autoindex off;
        auth_basic "Jogos";
        auth_basic_user_file /etc/nginx/logins.htpasswd;

        location = /saude { default_type text/plain; return 200 "ok\n"; }

        # Pagina de status aberta pelo quadrado do ZimaOS.
        location = / { rewrite ^ /instalador/index.html last; }

        # Catalogo e atualizacoes do programa.
        location /instalador/ { add_header Cache-Control "no-store"; }

        # Jogo novo colocado na pasta Game ja pode ser baixado. Ficam de fora as Roms
        # (o RomM cuida delas) e os arquivos soltos na raiz.
        location ~ "^/jogos/([^/]+$|Roms/)" {
            return 403;
        }
        location /jogos/ {
            limit_conn remota 4;
            limit_conn amigo 1;
        }

        # Andamento dos downloads dos amigos para o painel Amigos: o nginx ja conferiu o
        # login, entao repassa quem e o amigo e a chave que so ele e o painel conhecem
        # (a mesma de amigos/dados/relato-chave.txt).
        location = /relato {
            client_max_body_size 4k;
            proxy_pass http://192.168.0.10:8094/relato;
            proxy_set_header X-Amigo $remote_user;
            proxy_set_header X-Relato-Chave "TROQUE-PELA-CHAVE-DO-PAINEL";
            proxy_set_header Origin "";
            proxy_set_header Authorization "";
        }

        # Quem esta em cada sala de multiplayer (avisos do plugin JogosPc): mesma chave.
        location = /salas {
            limit_except GET { deny all; }
            proxy_pass http://192.168.0.10:8094/salas;
            proxy_set_header X-Amigo $remote_user;
            proxy_set_header X-Relato-Chave "TROQUE-PELA-CHAVE-DO-PAINEL";
            proxy_set_header Authorization "";
        }

        location / { return 403; }
    }
}
