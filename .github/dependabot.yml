# Dependabot da vitrine: este repo e gerado a partir do repo de trabalho, onde as atualizacoes
# entram e sao testadas. Aqui ficam so os alertas de seguranca; PR de versao, nenhum
# (open-pull-requests-limit: 0).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: docker-compose
    directories:
      - /servidor/amigos
      - /servidor/jogos-pc
      - /servidor/monitor
      - /servidor/syncthing
      - /servidor/trofeus
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
