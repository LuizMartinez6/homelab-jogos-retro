name: testes

on:
  push:
  pull_request:

# So leitura: a pipeline nunca escreve no repositorio nem publica nada.
permissions:
  contents: read

# Push novo na mesma branch cancela a rodada anterior.
concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

# As Actions ficam presas pelo SHA do commit (a tag pode ser movida por quem invadir o repo
# da Action). O Dependabot (.github/dependabot.yml) abre PR quando sai versao nova.
jobs:
  segredos:
    # Varre o historico inteiro atras de senhas, tokens e chaves (o que o .gitignore
    # e os testes do repo.Tests.ps1 nao pegam: qualquer formato conhecido de segredo).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1

  servidor-linux:
    # Linux com Docker: aqui rodam os testes do nginx em container, que no Windows sao pulados.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Instalar ferramentas
        run: python -m pip install --quiet ruff pytest
      - name: Lint Python (ruff, com as regras de seguranca S)
        run: python -m ruff check .
      - name: Testes do servidor (pytest)
        run: python -m pytest -rs testes/servidor

  testes:
    # Windows: o instalador e as ferramentas sao PowerShell 5.1 e csc do .NET Framework.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Instalar ferramentas
        shell: pwsh
        run: |
          python -m pip install --quiet ruff pytest
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      # Sem Playnite nem Docker com containers Linux aqui: esses testes sao pulados.
      - name: Lint e testes
        shell: pwsh
        run: ./testes.ps1
