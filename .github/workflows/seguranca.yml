name: seguranca

# Analise de seguranca do codigo e da propria pipeline. Roda em PR, no push da main
# e toda segunda de manha (pega regra nova do CodeQL mesmo sem commit novo).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    # CodeQL e gratis em repo publico. Em repo privado sem GitHub Advanced Security o envio
    # dos resultados falha, entao o job so roda depois que o repo virar publico.
    if: ${{ !github.event.repository.private }}
    name: codeql (${{ matrix.linguagem }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # grava os alertas na aba Security
    strategy:
      fail-fast: false
      matrix:
        # python: painel, monitor, trofeus, catalogo. csharp: plugin do Playnite e os .exe
        # (sem compilar: o csc daqui nao tem o SDK do Playnite). actions: os proprios workflows.
        linguagem: [python, csharp, actions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /linguagem:${{ matrix.linguagem }}

  workflows:
    # zizmor: procura falhas nos proprios workflows (injecao de ${{ }} em run:, token com
    # permissao demais, Action sem SHA, pull_request_target perigoso...).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: zizmor
        run: |
          python -m pip install --quiet zizmor==1.33.1
          zizmor --offline --min-severity low .github/workflows
